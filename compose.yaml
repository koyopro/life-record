# 開発用のミドルウェア。本番は Neon（DB）と S3（画像）を使う。
services:
  db:
    image: postgres:17-alpine
    container_name: datalake-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: datalake
      POSTGRES_PASSWORD: datalake
      POSTGRES_DB: datalake
      TZ: Asia/Tokyo
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datalake -d datalake"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 開発用の S3 互換ストレージ。本番の S3 と同じ署名付き URL で扱えるので、
  # 画像まわりを AWS のバケットなしで動かせる。
  storage:
    image: minio/minio:latest
    container_name: datalake-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: datalake
      MINIO_ROOT_PASSWORD: datalake-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # バケットを1度だけ作る。作成後は終了する。
  storage-init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 datalake datalake-secret &&
      mc mb --ignore-existing local/datalake-images &&
      echo 'bucket ready'
      "

volumes:
  db-data:
  storage-data:
